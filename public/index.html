<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简易聊天室</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #f2f3f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 登录界面 */
        #loginView {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 320px;
        }

        #loginView h1 {
            font-size: 20px;
            margin: 0 0 20px;
            text-align: center;
        }

        #loginView input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        #loginView button {
            width: 100%;
            padding: 10px;
            background: #4a6cf7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        #loginView button:hover {
            background: #3a5ce0;
        }

        #loginError {
            color: #e0413c;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 8px;
        }

        /* 聊天界面 */
        #chatView {
            display: none;
            width: 480px;
            height: 640px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            flex-direction: column;
            overflow: hidden;
        }

        #chatHeader {
            padding: 14px 16px;
            background: #4a6cf7;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chatHeader button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .msg {
            margin-bottom: 10px;
        }

        .msg .meta {
            font-size: 11px;
            color: #999;
            margin-bottom: 2px;
        }

        .msg .bubble {
            display: inline-block;
            background: #f0f1f5;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 80%;
            word-break: break-word;
        }

        .msg.self .bubble {
            background: #dfe8ff;
        }

        #inputBar {
            display: flex;
            border-top: 1px solid #eee;
            padding: 10px;
            gap: 8px;
        }

        #inputBar input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        #inputBar button {
            padding: 10px 16px;
            background: #4a6cf7;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #countdown {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 12px;
            border-radius: 8px;
            letter-spacing: 1px;
        }

        #countdown.warning {
            background: #e0413c;
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }
    </style>
</head>

<body>

    <div id="loginView">
        <div id="loginError"></div>
        <input id="passwordInput" type="password" placeholder="密码" />
        <button id="loginBtn">登录</button>
    </div>

    <div id="chatView">
        <div id="chatHeader">
            <span id="whoami"></span>
            <span id="countdown">5:00</span>
            <button id="logoutBtn">退出</button>
        </div>
        <div id="messages"></div>
        <div id="inputBar">
            <input id="textInput" type="text" placeholder="输入消息..." maxlength="1000" />
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
</body>

</html>
